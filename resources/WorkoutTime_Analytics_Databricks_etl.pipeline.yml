# The main pipeline for WorkoutTime_Analytics_Databricks

resources:
  pipelines:
    WorkoutTime_Analytics_Databricks_etl:
      name: WorkoutTime_Analytics_Databricks_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/WorkoutTime_Analytics_Databricks_etl"

      libraries:
        - glob:
            include: ../src/WorkoutTime_Analytics_Databricks_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
